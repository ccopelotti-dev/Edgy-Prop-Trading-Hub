 const byDay = {};
 daily.forEach(d =>{ if (!byDay[d.date]) byDay[d.date] = []; byDay[d.date].push(d.pnl); });
 const out = {};
 Object.entries(byDay).forEach(([date, pnls]) =>{

 }
 out[date] = parseFloat(dayPnl.toFixed(2));
 });
 return out;
 };

 const nextBusinessDay = (dateStr, n=1) =>{
 if (!dateStr) return null;
 // Parse date safely
 let d;
 if (dateStr.includes('/')) {
 const parts = dateStr.split('/');
 d = parts[0].length===4
 ? new Date(parts[0], parts[1]-1, parts[2]) // YYYY/MM/DD
 : new Date(parts[2], parts[1]-1, parts[0]); // DD/MM/YYYY

 d = new Date(dateStr + 'T12:00:00');

 };

 const simResultsCache = {};

 // ==============================================================
 // ITERADOR TRADE-LEVEL - corazón común de las 4 fases
 // ==============================================================
 // Itera trades en orden cronológico y aplica las reglas del
 // prop firm a nivel de trade individual, no sobre agregados diarios.
 //
 // Reglas aplicadas por trade (en orden):
 // 1. Si el trade es pérdida -> se suma al día y el día CIERRA
 // (applyOperativeFilters ya dejó solo 1 stop/día).
 // 2. Si el trade es ganancia:
 // a. Cap ganancia/día: si dayPnl + trade > cap -> se toma solo
 // lo que falta para llegar al cap, day CIERRA.
 // b. Objetivo (si aún no alcanzado): si el trade crosea el
 // objetivo -> se toma solo lo que falta para llegar exacto
 // al objetivo, day CIERRA y cicloCerrado = true.
 // c. Si objetivo ya alcanzado -> excedente se acumula entero.
 //
 // Al cerrar cada día:
 // - dailyLoss: si dayPnl < -dailyLoss -> QUEMADA.
 // - balance / pnl / diasPos se actualizan.
 // - threshold trailing (si aplica) sube hasta el tope.
 // - Piso: si balance <= threshold -> QUEMADA.
 // - Si pnl >= objetivo y diasPos >= minDiasPos -> CIERRE (SUPERADA/RETIRO).
 //
 // Parámetros:
 // trades - array {date, pnl} ordenado cronológicamente
 // startDate - YYYY-MM-DD desde donde arrancar (inclusive)
 // cfg - configuración del ciclo (ver estructura abajo)
 //
 // Retorna: { resultado, balance, pnl, dias, diasPos, ini, fin,
 // threshold, trailingFinal, closedByObjetivo }
 // ==============================================================
 const runCycleTradeLevel = (trades, startDate, cfg) =>{
 const {
 objetivo,
 dailyLoss,
 cap = Infinity,
 minDiasPos = 1,
 minPnlDiaPos = 0,
 balanceInicial,
 pnlInicial = 0,
 pisoFijo = null, // si !null: threshold es este valor, inamovible (Retiros)
 trailingEnabled = false, // si true: threshold sube con el balance (B1/B2/Eval EOD)
 congelaEn = null, // tope del threshold cuando trailing
 balanceOriginalCuenta, // para threshold inicial en fases que heredan (B2)
 stopOnSuperada = true, // si objetivo alcanzado y diasPos cumplidos -> cerrar
 } = cfg;

 // Filtrar trades desde startDate, agrupar por día en orden
 const tradesFromStart = trades.filter(t => t.date >= startDate);
 if (tradesFromStart.length === 0) {
 return { resultado:'EN_CURSO', balance:balanceInicial, pnl:pnlInicial, dias:0, diasPos:0, ini:startDate, fin:startDate, threshold:null, closedByObjetivo:false };
 }
 const byDay = {};
 for (const t of tradesFromStart) {
 if (!byDay[t.date]) byDay[t.date] = [];
 byDay[t.date].push(t);
 }
 const dates = Object.keys(byDay).sort();

 let balance = balanceInicial;
 let pnl = pnlInicial; // pnl acumulado del ciclo
 let dias = 0, diasPos = 0;
 let resultado = 'EN_CURSO';
 const ini = dates[0];
 let fin = dates[0];

 // Base para threshold:
 // - Retiros: pisoFijo (inamovible)
 // - B2 (hereda): balanceOriginalCuenta - dailyLoss (y trailing hasta balanceOriginalCuenta + congelaEn)
 // - B1/Eval: balanceInicial - dailyLoss (y trailing hasta balanceInicial + congelaEn)
 const refBase = (balanceOriginalCuenta != null) ? balanceOriginalCuenta : balanceInicial;
 let threshold = (pisoFijo != null) ? pisoFijo : (refBase - dailyLoss);
 const trailingCap = (congelaEn != null) ? refBase + congelaEn : refBase;

 let closedByObjetivo = false;

 outer:
 for (const date of dates) {
 fin = date;
 let dayPnl = 0;
 let diaCerradoPorObjetivo = false;

 for (const t of byDay[date]) {
 if (t.pnl < 0) {
 // Stop -> el trade entero entra y el día cierra
 dayPnl += t.pnl;
 break;
 }
 if (t.pnl > 0) {
 let contrib = t.pnl;

 // 1) Cap ganancia/día: si al sumar superaríamos el cap
 if (cap !== Infinity && cap > 0 && dayPnl + contrib > cap) {
 contrib = cap - dayPnl;
 if (contrib < 0) contrib = 0;
 dayPnl += contrib;
 break; // cap alcanzado -> día cierra
 }

 // 2) Objetivo (solo si aún no alcanzado)
 if (pnl < objetivo) {
 const faltaObj = objetivo - (pnl + dayPnl);
 if (contrib >= faltaObj && faltaObj > 0) {
 dayPnl += faltaObj;
 diaCerradoPorObjetivo = true;
 break; // objetivo crosseado -> día cierra
 }
 }

 // Caso normal: se agrega entera
 dayPnl += contrib;
 }
 }

 // Violación daily loss (si cruza el umbral)
 if (dayPnl < -dailyLoss) {
 balance += dayPnl;
 resultado = 'QUEMADA';
 break outer;
 }

 // Commit del día
 balance += dayPnl;
 pnl += dayPnl;
 dias++;
 if (dayPnl > 0 && dayPnl >= minPnlDiaPos) diasPos++;

 // Trailing EOD (si aplica)
 if (trailingEnabled) {
 const nuevoT = Math.min(balance - dailyLoss, trailingCap);
 if (nuevoT > threshold) threshold = nuevoT;
 }

 // Piso / threshold
 if (balance <= threshold) {
 resultado = 'QUEMADA';
 break outer;
 }

 // Cierre por objetivo (requiere ambos: pnl suficiente + diasPos)
 if (stopOnSuperada && pnl >= objetivo && diasPos >= minDiasPos) {
 resultado = 'SUPERADA';
 closedByObjetivo = true;
 break outer;
 }

 // Si objetivo ya se alcanzó pero faltan días pos -> sigue operando
 // (el bucle continúa; excedente acumula al balance)
 if (diaCerradoPorObjetivo && diasPos >= minDiasPos) {
 resultado = 'SUPERADA';
 closedByObjetivo = true;
 break outer;
 }
 }

 return {
 resultado, balance,
 pnl: parseFloat(pnl.toFixed(2)),
 dias, diasPos,
 ini, fin,
 threshold, closedByObjetivo,
 };
 };

 const capDiario = p.maxGanDiaria > 0 ? Math.min(p.maxGanDiaria, capBase) : capBase;

 // -- Filtro opcional "Fecha inicio CSV" --

 // qué pasa si arrancás la operativa en un mercado distinto al del tramo inicial del CSV.
 const trades = p.fechaInicioCsv

 : dbBt.metrics.trades;
 if (trades.length === 0) { antd.message.warning('Con ese filtro de fecha no quedan trades. Ajustá o quitá el filtro.'); setRunning(false); return; }
 const sortedDates = Array.from(new Set(trades.map(t => t.date))).sort();
 if (sortedDates.length === 0) { antd.message.warning('No hay días en el CSV.'); setRunning(false); return; }

 // -- Patrón semanal fijo de compras (día calendario) --
 // getUTCDay: 0=Dom 1=Lun 2=Mar 3=Mié 4=Jue 5=Vie 6=Sáb
 const buildWeeklyPattern = (n) =>{
 const nn = Math.max(1, Math.floor(n));
 if (nn === 1) return {1:1}; // L
 if (nn === 2) return {1:1, 5:1}; // L, V
 if (nn === 3) return {1:1, 3:1, 5:1}; // L, X, V
 if (nn === 4) return {1:1, 3:1, 4:1, 5:1}; // L, X, J, V
 // base: 1 cuenta/día hábil
 const base = {1:1, 2:1, 3:1, 4:1, 5:1};
 // excedentes n> 5: duplicar empezando por L-> M-> X-> J-> V
 const order = [1, 2, 3, 4, 5];
 const extras = nn - 5;
 for (let i = 0; i < extras; i++) base[order[i % 5]]++;
 return base;
 };
 const weeklyPat = buildWeeklyPattern(p.cuentasPorSemana);
 const weeklyPatW1 = p.cuentasSemana1 > 0 ? buildWeeklyPattern(p.cuentasSemana1) : null;

 // -- Próximo índice del CSV estrictamente después de fechaCompra --
 const findStartIdxAfter = (fechaCompra) =>{
 for (let i = 0; i < sortedDates.length; i++) {
 if (sortedDates[i] > fechaCompra) return i;
 }
 return -1;
 };

 // -- Generar lista de compras por fecha calendario --
 // fechaCompra = día calendario fijo del patrón (débito cashflow)
 // startIdx = próximo día con datos en el CSV (inicio operativa)
 const comprasList = [];
 const curr = new Date(sortedDates[0] + 'T12:00:00Z');
 const endDate = new Date(sortedDates[sortedDates.length-1] + 'T12:00:00Z');
 // Ventana frontload = 7 días calendario desde el primer día del CSV
 const fronloadCutoff = new Date(curr.getTime() + 7*24*3600*1000);
 while (curr <= endDate) {
 const dow = curr.getUTCDay();
 const isWeek1 = weeklyPatW1 && curr < fronloadCutoff;
 const pat = isWeek1 ? weeklyPatW1 : weeklyPat;
 const count = pat[dow] || 0;
 if (count > 0) {
 const fechaCompra = curr.toISOString().substring(0, 10);
 for (let k = 0; k < count; k++) {
 const startIdx = findStartIdxAfter(fechaCompra);
 if (startIdx === -1) break; // CSV no cubre más
 comprasList.push({ fechaCompra, startIdx });
 }
 }
 curr.setUTCDate(curr.getUTCDate() + 1);
 }

 for (let c = 0; c < comprasList.length; c++) {
 const { fechaCompra, startIdx } = comprasList[c];

 });

 const motivoQuemada = `Balance $${r.balance.toFixed(0)} <= threshold $${(r.threshold||0).toFixed(0)} (${p.ddTipo.toUpperCase()})`;
 cuentaResults.push({
 ciclo: c+1, resultado: r.resultado,

 ini: startDate, fin: r.fin, // rango de operativa real

 });
 }

 superadas.forEach(r => distSuperadas[bloqueFn(r.dias)]++);
 quemadas.forEach(r => distQuemadas[bloqueFn(r.dias)]++);

 setResults({ ciclos: cuentaResults, superadas, quemadas, tasaAprobacion, costoTotal, totalCuentas: cuentaResults.length, bloques, distSuperadas, distQuemadas, capDiario });

 setRunning(false);

 // ------------------------------------------------------------
 // CASHFLOW REPORT - consolida Eval + Buffer1 + Buffer2 + Retiros
 // ------------------------------------------------------------
 const CashflowReport = ({ strategies, strategyId }) =>{

 // -- Buscar cadena de estrategias vinculadas ---------------
 // Parte desde la estrategia actual y sube por el cache
 const buildChain = () =>{
 // Encontrar estrategias de cada fase
 const evalStrats = strategies.filter(s => s.phase === 'evaluacion');
 const b1Strats = strategies.filter(s => s.phase === 'buffer1' || s.phase === 'buffer');
 const b2Strats = strategies.filter(s => s.phase === 'buffer2');
 const retStrats = strategies.filter(s => s.phase === 'retiros');

 // Tomar el cache de cada fase (el que tenga datos)
 const evalCache = evalStrats.map(s => simResultsCache[s.id]).find(c => c?.phase === 'evaluacion');
 const b1Cache = b1Strats.map(s => simResultsCache[s.id]).find(c => c?.phase === 'buffer1');
 const b2Cache = b2Strats.map(s => simResultsCache[s.id]).find(c => c?.phase === 'buffer2');
 const retCache = retStrats.map(s => simResultsCache[s.id]).find(c => c?.phase === 'retiros');

 // También buscar en el cache de la estrategia actual
 const currentCache = simResultsCache[strategyId];

 return { evalCache, b1Cache, b2Cache, retCache, currentCache };
 };

 const { evalCache, b1Cache, b2Cache, retCache, currentCache } = buildChain();

 // -- Buscar parámetros de costo de eval -------------------
 const evalStrat = strategies.find(s => s.phase === 'evaluacion');
 // El costo lo guardamos en simResultsCache como metadata
 const costoPorCuenta = simResultsCache[evalStrat?.id]?.costoPorCuenta || 80;

 // -- Construir movimientos ---------------------------------
 const buildMovimientos = () =>{
 const movs = [];

 // 1. DEBITOS: compras de evaluación (todas las cuentas - superadas + quemadas)
 const todasEval = evalCache?.todasLasCuentas || [
 ...(evalCache?.superadas||[]),
 ...(evalCache?.quemadas||[])
 ];
 todasEval.forEach((s, i) =>{
 movs.push({
 // Prioridad: fechaCompra (día calendario del patrón) > ini > fin
 // fechaCompra asegura débitos parejos por mes alineados a la semana calendario.
 fecha: s.fechaCompra || s.ini || s.fin,
 concepto: `Compra Eval Cta ${i+1}${s.resultado==='QUEMADA'?' (quemada)':''}`,
 tipo: 'debito',
 monto: costoPorCuenta,
 etapa: 'Evaluación',
 });
 });

 // 2. CREDITOS (Buffer 2): 1er retiro del ciclo de vida
 // Antes estaba omitido - se contabilizaban solo los retiros de la fase Retiros.
 if (b2Cache?.retiros) {
 b2Cache.retiros.forEach((r, i) =>{
 movs.push({
 fecha: r.fin,
 concepto: `Retiro B2 Cta ${r.cuentaIdx||i+1} - Ciclo #1 (lifecycle)`,
 tipo: 'credito',
 monto: r.retiro || 0,
 etapa: 'Buffer 2',
 });
 });
 }

 // 3. CREDITOS (Retiros phase): retiros #2 a #N del ciclo de vida
 // nroRetiro=1 acá corresponde al retiro #2 del lifecycle (B2 fue el #1)
 const retSrc = retCache || currentCache;
 if (retSrc?.retiros) {
 retSrc.retiros.forEach((r, i) =>{
 const cicloLifecycle = (r.nroRetiro||0) + 1; // +1 porque B2 ya consumió el #1
 movs.push({
 fecha: r.fin,
 concepto: `Retiro Cta ${r.cuentaIdx||i+1} - Ciclo #${cicloLifecycle} (lifecycle)`,
 tipo: 'credito',
 monto: r.retiro || 0,
 etapa: 'Retiros',
 });
 });
 }

 // Ordenar por fecha
 return movs.filter(m => m.fecha).sort((a,b) => a.fecha.localeCompare(b.fecha));
 };

 const movimientos = buildMovimientos();

 // -- Calcular saldo acumulado ------------------------------
 let saldoAcum = 0;
 const movsConSaldo = movimientos.map(m =>{
 if (m.tipo === 'debito') saldoAcum -= m.monto;
 else saldoAcum += m.monto;
 return { ...m, saldoAcum: parseFloat(saldoAcum.toFixed(2)) };
 });

 // -- Resumen mensual ---------------------------------------
 const mensualMap = {};
 movsConSaldo.forEach(m =>{
 const mes = m.fecha.substring(0,7);
 if (!mensualMap[mes]) mensualMap[mes] = { compras: 0, retiros: 0 };
 if (m.tipo === 'debito') mensualMap[mes].compras += m.monto;
 else mensualMap[mes].retiros += m.monto;
 });
 const mensualArr = Object.entries(mensualMap).sort(([a],[b])=> a.localeCompare(b)).map(([mes, v]) =>{
 const neto = v.retiros - v.compras;
 return { mes, compras: v.compras, retiros: v.retiros, neto };
 });

 // Saldo acumulado mensual
 let saldoMes = 0;
 const mensualConSaldo = mensualArr.map(m =>{
 saldoMes += m.neto;
 return { ...m, saldoAcum: parseFloat(saldoMes.toFixed(2)) };
 });

 // -- KPIs -------------------------------------------------
 const totalInvertido = movsConSaldo.filter(m=> m.tipo==='debito').reduce((s,m)=> s+m.monto,0);
 const totalRetiros = movsConSaldo.filter(m=> m.tipo==='credito').reduce((s,m)=> s+m.monto,0);
 const saldoFinal = totalRetiros - totalInvertido;
 const roi = totalInvertido > 0 ? ((saldoFinal/totalInvertido)*100).toFixed(1) : 0;
 const breakEvenMes = mensualConSaldo.find(m=> m.saldoAcum>=0)?.mes || '-';
 const mejorMes = mensualConSaldo.length > 0
 ? mensualConSaldo.reduce((best,m)=> m.neto> best.neto?m:best, mensualConSaldo[0])
 : null;

 const html = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title> Cashflow Simulación</title><style> ${style}</style></head><body> <h1> Cashflow - Simulación de Estrategia</h1> <p style="color:#888;font-size:10px"> Generado: ${new Date().toLocaleString('es-AR')}</p> ${kpisHtml}

 const win = window.open('', '_blank');

 const BacktestCharts = ({ monthly, daily, strategyId }) =>{
 const monthlyRef = React.useRef(null);
 const dailyRef = React.useRef(null);
 const monthlyChart = React.useRef(null);
 const dailyChart = React.useRef(null);

 React.useEffect(() =>{
 if (!monthly || monthly.length === 0) return;

 // -- Datos mensuales -----------------------------------
 const mLabels = monthly.map(m => String(m.month||'').substring(2).replace('-','/'));
 const mPnls = monthly.map(m => parseFloat(Number(m.pnl).toFixed(2)));
 const mColors = mPnls.map(v => v >= 0 ? 'rgba(82,196,26,0.78)' : 'rgba(255,77,79,0.75)');

 // -- Datos diarios (filtrar sáb/dom) -------------------
 const dailyFiltered = (daily || []).filter(d =>{
 if (!d.date) return false;
 const dow = new Date(d.date + 'T12:00:00').getDay(); // evitar timezone issues
 return dow !== 0 && dow !== 6; // 0=dom, 6=sab
 });
 const dLabels = dailyFiltered.map(d => d.date ? d.date.substring(5) : ''); // MM-DD
 const dPnls = dailyFiltered.map(d => parseFloat(Number(d.pnl).toFixed(2)));
 const dColors = dPnls.map(v => v >= 0 ? 'rgba(82,196,26,0.72)' : 'rgba(255,77,79,0.68)');

 // Destruir instancias previas
 if (monthlyChart.current) { monthlyChart.current.destroy(); monthlyChart.current = null; }
 if (dailyChart.current) { dailyChart.current.destroy(); dailyChart.current = null; }

 const tooltipBase = {
 backgroundColor: '#1a1a2e',
 titleColor: '#ccc',
 bodyColor: '#fff',
 padding: 10,
 cornerRadius: 6,
 };

 // -- Gráfico 1: PnL Mensual ----------------------------
 if (monthlyRef.current) {
 monthlyChart.current = new window.Chart(monthlyRef.current, {
 type: 'bar',
 data: {
 labels: mLabels,
 datasets: [{
 label: 'PnL Mensual',
 data: mPnls,
 backgroundColor: mColors,
 borderRadius: 3,
 borderSkipped: false,
 }]
 },
 options: {
 responsive: true,
 maintainAspectRatio: false,
 interaction: { mode: 'index', intersect: false },
 plugins: {
 legend: { display: false },
 tooltip: {
 ...tooltipBase,
 callbacks: {
 title: ctx =>`Mes: ${ctx[0].label}`,
 label: ctx =>{
 const v = ctx.parsed.y;
 const sign = v >= 0 ? '+' : '';
 return ` PnL Mensual: ${sign}$${v.toLocaleString('es-AR', {minimumFractionDigits:0, maximumFractionDigits:0})}`;
 }
 }
 }
 },
 scales: {
 x: { ticks: { font: { size: 9 }, color: '#aaa', maxRotation: 45, autoSkip: true, maxTicksLimit: 24 }, grid: { display: false } },
 y: { ticks: { font: { size: 10 }, color: '#888', callback: v =>'$' + v.toLocaleString() }, grid: { color: 'rgba(0,0,0,0.05)' } }
 }
 }
 });
 }

 // -- Gráfico 2: PnL Diario -----------------------------
 if (dailyRef.current && dailyFiltered.length > 0) {
 dailyChart.current = new window.Chart(dailyRef.current, {
 type: 'bar',
 data: {
 labels: dLabels,
 datasets: [{
 label: 'PnL Diario',
 data: dPnls,
 backgroundColor: dColors,
 borderRadius: 2,
 borderSkipped: false,
 barPercentage: 0.9,
 }]
 },
 options: {
 responsive: true,
 maintainAspectRatio: false,
 interaction: { mode: 'index', intersect: false },
 plugins: {
 legend: { display: false },
 tooltip: {
 ...tooltipBase,
 callbacks: {
 title: ctx =>`Día: ${ctx[0].label}`,
 label: ctx =>{
 const v = ctx.parsed.y;
 const sign = v >= 0 ? '+' : '';
 return ` PnL Diario: ${sign}$${v.toLocaleString('es-AR', {minimumFractionDigits:0, maximumFractionDigits:0})}`;
 }
 }
 }
 },
 scales: {
 x: { ticks: { font: { size: 8 }, color: '#aaa', maxRotation: 45, autoSkip: true, maxTicksLimit: 30 }, grid: { display: false } },
 y: { ticks: { font: { size: 10 }, color: '#888', callback: v =>'$' + v.toLocaleString() }, grid: { color: 'rgba(0,0,0,0.05)' } }
 }
 }
 });
 }

 return () =>{
 if (monthlyChart.current) { monthlyChart.current.destroy(); monthlyChart.current = null; }
 if (dailyChart.current) { dailyChart.current.destroy(); dailyChart.current = null; }
 };
 }, [monthly, daily, strategyId]);

 return (
 <div style={{width:'100%'}}> {/* Gráfico 1: PnL Mensual */}
 <div style={{marginBottom:16}}> <div style={{fontSize:12,fontWeight:600,color:'#555',marginBottom:6}}> PnL Mensual <span style={{fontWeight:400,color:'#aaa',fontSize:11}}>(hover para ver valor)</span></div> <div style={{width:'100%',height:160,borderRadius:8,background:'#fafafa',padding:'8px'}}> <canvas ref={monthlyRef} role="img" aria-label="PnL mensual"></canvas> </div> </div> {/* Gráfico 2: PnL Diario (sin sáb/dom) */}
 <div> <div style={{fontSize:12,fontWeight:600,color:'#555',marginBottom:6}}> PnL Diario <span style={{fontWeight:400,color:'#aaa',fontSize:11}}>(lun-vie, hover para ver valor)</span></div> <div style={{width:'100%',height:160,borderRadius:8,background:'#fafafa',padding:'8px'}}> <canvas ref={dailyRef} role="img" aria-label="PnL diario"></canvas> </div> </div> </div> );
 };

 const App = () =>{
 const [isAuthenticated, setIsAuthenticated] = React.useState(false);
 const [loginError, setLoginError] = React.useState(false);
 const [users, setUsers] = React.useState([]);
 const [currentUser, setCurrentUser] = React.useState(null);
 const [ssoChecking, setSsoChecking] = React.useState(true);

 // -- Autenticacion (Supabase Auth) ---------------------------
 // Dos caminos llegan aca:
 // 1) SSO desde Edgy Sistemas: el panel interno arma un link con la
 //    sesion de Supabase actual pegada en el hash de la URL. Se toma
 //    esa sesion (setSession) y listo, no vuelve a pedir clave.
 // 2) Sesion propia persistida (login manual desde el celu u otro
 //    navegador): Supabase guarda la sesion sola (persistSession) asi
 //    que getUser() ya la encuentra sin pasar por el hash.
 // En ambos casos se valida que el email este en SSO_ALLOWED_EMAILS
 // antes de dar acceso -- ya no depende de la tabla `users` (RLS
 // cerrada, sin uso).
 React.useEffect(() =>{
 (async () =>{
 try {
 const hash = window.location.hash || '';
 const params = new URLSearchParams(hash.replace(/^#/, ''));
 const ssoAccess = params.get('sso_access_token');
 const ssoRefresh = params.get('sso_refresh_token');
 if (ssoAccess && ssoRefresh) {
 history.replaceState(null, '', window.location.pathname + window.location.search);
 await supabase.auth.setSession({ access_token: ssoAccess, refresh_token: ssoRefresh });
 }
 const { data: userData } = await supabase.auth.getUser();
 const email = (userData && userData.user && userData.user.email || '').toLowerCase();
 if (email && SSO_ALLOWED_EMAILS.includes(email)) {
 setCurrentUser({ id: userData.user.id, email, username: email.split('@')[0], role: 'admin' });
 setIsAuthenticated(true);
 } else if (email) {
 await supabase.auth.signOut();
 }
 } catch (e) { console.error('Auth Trading Hub:', e); }
 setSsoChecking(false);
 })();
 }, []);

 // -- Personal / Salud: notificaciones push -----------------------
 // Clave pública VAPID (la privada vive solo en el server / Edge
 // Function). Hay que convertirla a Uint8Array porque así la pide
 // pushManager.subscribe -- el formato que da Supabase/el generador
 // es base64url.
 const VAPID_PUBLIC_KEY = 'BEAvSc5X0mEQ_-z7ocpRww2MbYJv4FhyUctQL5qCqc7BCduE9uf5VlFA2zv-7bAWaLIFkebJuwq5Pl8P-Zz90PQ';
 const urlBase64ToUint8Array = (base64String) =>{
 const padding = '='.repeat((4 - base64String.length % 4) % 4);
 const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
 const rawData = window.atob(base64);
 const outputArray = new Uint8Array(rawData.length);
 for (let i = 0; i < rawData.length; ++i) outputArray[i] = rawData.charCodeAt(i);
 return outputArray;
 };

 const [saludActiveTab, setSaludActiveTab] = React.useState('seguimiento');
 const [pushStatus, setPushStatus] = React.useState('unknown'); // unknown | subscribed | unsubscribed | unsupported
 const [pushLoading, setPushLoading] = React.useState(false);

 const refreshPushStatus = React.useCallback(async () =>{
 if (!('serviceWorker' in navigator) || !('PushManager' in window)) { setPushStatus('unsupported'); return; }
 try{
 const reg = await navigator.serviceWorker.ready;
 const sub = await reg.pushManager.getSubscription();
 setPushStatus(sub ? 'subscribed' : 'unsubscribed');
 }catch(e){ setPushStatus('unsupported'); }
 }, []);

 const activarNotificaciones = async () =>{
 setPushLoading(true);
 try{
 if (!('serviceWorker' in navigator) || !('PushManager' in window)) { message.error('Este navegador no soporta notificaciones push.'); return; }
 const permiso = await Notification.requestPermission();
 if (permiso !== 'granted') { message.warning('No diste permiso de notificaciones.'); return; }
 const reg = await navigator.serviceWorker.ready;
 let sub = await reg.pushManager.getSubscription();
 if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY) });
 const raw = sub.toJSON();
 const { error } = await supabase.from('push_subscriptions').upsert({ endpoint: raw.endpoint, p256dh: raw.keys.p256dh, auth: raw.keys.auth, user_agent: navigator.userAgent }, { onConflict: 'endpoint' });
 if (error) throw error;
 setPushStatus('subscribed');
 message.success('Notificaciones activadas en este dispositivo.');
 }catch(err){ message.error('No se pudo activar: ' + err.message); }
 finally{ setPushLoading(false); }
 };

 const desactivarNotificaciones = async () =>{
 setPushLoading(true);
 try{
 const reg = await navigator.serviceWorker.ready;
 const sub = await reg.pushManager.getSubscription();
 if (sub) { await supabase.from('push_subscriptions').delete().eq('endpoint', sub.endpoint); await sub.unsubscribe(); }
 setPushStatus('unsubscribed');
 message.success('Notificaciones desactivadas en este dispositivo.');
 }catch(err){ message.error('No se pudo desactivar: ' + err.message); }
 finally{ setPushLoading(false); }
 };

 // -- Salud: Historial de medicación (detección de olvidos) -----------
 // Compara, día por día de los últimos 30, lo que correspondía tomar
 // (horarios fijos de cada medicación, según su propio fecha_inicio/
 // fecha_fin -- no el flag "activo" actual, para no reescribir el
 // pasado si una medicación se pausó hoy) contra lo que efectivamente
 // quedó marcado en salud_medicacion_tomas. Los PRN no entran acá --
 // no hay un "correspondía" para algo que es según necesidad.
 const [historialTomas, setHistorialTomas] = React.useState([]);
 const fetchHistorialTomas = async () =>{
 const desde = dayjs().subtract(29, 'day').format('YYYY-MM-DD');
 const { data, error } = await supabase.from('salud_medicacion_tomas').select('*').gte('fecha', desde).not('hora', 'is', null);
 if (!error && data) setHistorialTomas(data);
 };

 const historialDias = React.useMemo(() =>{
 const dias = [];
 for (let i = 0; i < 30; i++){
 const d = dayjs().subtract(i, 'day').format('YYYY-MM-DD');
 const esperadas = [];
 saludMedicacion.forEach(m =>{
 if (!m.horarios || m.horarios.length === 0) return;
 if (m.fecha_inicio && m.fecha_inicio > d) return;
 if (m.fecha_fin && m.fecha_fin < d) return;
 m.horarios.forEach(h => esperadas.push({ medId: m.id, nombre: m.nombre, horario: String(h).slice(0,5) }));
 });
 if (esperadas.length === 0) continue;
 const tomasDia = historialTomas.filter(t => t.fecha === d);
 const faltantes = esperadas.filter(e => !tomasDia.some(t => t.medicacion_id === e.medId && t.hora.slice(0,5) === e.horario));
 dias.push({ fecha: d, esperadas: esperadas.length, cumplidas: esperadas.length - faltantes.length, faltantes });
 }
 return dias;
 }, [saludMedicacion, historialTomas]);

 function calcularCumplimiento(dias){
 const esp = dias.reduce((s,d) => s + d.esperadas, 0);
 const cum = dias.reduce((s,d) => s + d.cumplidas, 0);
 return esp === 0 ? null : Math.round((cum / esp) * 100);
 }
 const cumplimiento7 = React.useMemo(() => calcularCumplimiento(historialDias.filter(d => dayjs().diff(dayjs(d.fecha), 'day') < 7)), [historialDias]);
 const cumplimiento30 = React.useMemo(() => calcularCumplimiento(historialDias), [historialDias]);
 function colorCumplimiento(pct){ return pct === null ? '#8a93a3' : pct >= 90 ? '#22a55e' : pct >= 70 ? '#d9822b' : '#cf1322'; }

 // -- Estado toggle filtros operativos ---------------------
 const [filterRules, setFilterRules] = React.useState({
 maxStopsPerDay: 1,
 maxWinsPerDay: 2,
 maxSlUsd: 400,
 enabled: false
 });

 // -- Función que aplica reglas operativas a nivel trade ----
 const applyOperativeFilters = (trades, rules) =>{
 if (!rules.enabled) return trades;
 const result = [];
 const tradesByDay = {};
 // Agrupar por día preservando orden
 trades.forEach(t =>{
 if (!tradesByDay[t.date]) tradesByDay[t.date] = [];
 tradesByDay[t.date].push(t);
 });
 Object.keys(tradesByDay).sort().forEach(date =>{
 let stops = 0, wins = 0;
 for (const trade of tradesByDay[date]) {
 const isLoss = trade.pnl < 0;
 const isWin = trade.pnl > 0;
 // Aplicar límite de stops
 if (isLoss) {
 if (stops >= rules.maxStopsPerDay) break; // día cerrado
 stops++;
 result.push(trade);
 break; // 1 stop = fin del día
 }
 // Aplicar límite de wins
 if (isWin) {
 if (wins >= rules.maxWinsPerDay) break;
 wins++;
 result.push(trade);
 }
 }
 });
 return result;
 };

 const parseBacktestCsv = (csvText, strategyId) =>{
 const rows = csvText.split('\n').filter(r => r.trim()).map(r => r.split(';').map(c => c.trim().replace(/['"]/g, '')));
 if (rows.length < 2) { message.error('CSV vacío o formato incorrecto.'); return; }

 const headers = rows[0].map(h => h.toLowerCase().trim());
 const findCol = (...names) => names.map(n => headers.findIndex(h => h.includes(n))).find(i => i !== -1) ?? -1;

 const pnlIdx = findCol('ganancia', 'ganancias', 'profit', 'pnl');
 const dateIdx = findCol('tiempo de entrada', 'tiempo d', 'open time', 'fecha');
 const resultIdx = findCol('nombre de salida', 'exit', 'resultado');
 const cantIdx = findCol('cant', 'quantity', 'size');

 if (pnlIdx === -1 || dateIdx === -1) { message.error('No se encontraron columnas de PnL o fecha.'); return; }

 const parseUSD = (val) =>{
 if (!val) return 0;
 return parseFloat(String(val).replace(/[^0-9.,-]/g,'').replace(',','.')) || 0;
 };

 // Normalizar fecha a YYYY-MM-DD independientemente del formato del CSV
 const normalizeDate = (raw) =>{
 if (!raw) return null;
 const s = raw.substring(0, 10).trim();
 if (s.includes('/')) {
 const parts = s.split('/');
 if (parts[0].length === 4) return `${parts[0]}-${parts[1]}-${parts[2]}`; // YYYY/MM/DD
 return `${parts[2]}-${parts[1]}-${parts[0]}`; // DD/MM/YYYY -> YYYY-MM-DD
 }
 return s; // ya es YYYY-MM-DD
 };
 const allTrades = rows.slice(1).map(row =>({
 date: normalizeDate(row[dateIdx]),
 pnl: parseUSD(row[pnlIdx]),
 result: row[resultIdx] || '',
 contracts: row[cantIdx] ? parseInt(row[cantIdx]) : 1,
 })).filter(t => t.date && t.date.length === 10);

 if (allTrades.length === 0) { message.error('Sin trades válidos en el CSV.'); return; }

 // -- Calcular métricas para un set de trades -----------
 const calcMetrics = (trades) =>{
 const totalTrades = trades.length;
 const wins = trades.filter(t => t.pnl > 0).length;
 const losses = trades.filter(t => t.pnl < 0).length;
 const wr = totalTrades > 0 ? wins / totalTrades : 0;
 const grossWin = trades.filter(t => t.pnl > 0).reduce((s,t) => s + t.pnl, 0);
 const grossLoss = Math.abs(trades.filter(t => t.pnl < 0).reduce((s,t) => s + t.pnl, 0));
 const pf = grossLoss > 0 ? grossWin / grossLoss : 0;
 const totalPnl = trades.reduce((s,t) => s + t.pnl, 0);

 // PnL diario (filtrar finde)
 const dailyMap = {};
 trades.forEach(t =>{ dailyMap[t.date] = (dailyMap[t.date] || 0) + t.pnl; });
 const dailyArr = Object.entries(dailyMap)
 .sort(([a],[b]) => a.localeCompare(b))
 .map(([date, pnl]) =>({ date, pnl }))
 .filter(({ date }) =>{ const dow = new Date(date + 'T12:00:00').getDay(); return dow !== 0 && dow !== 6; });

 // PnL mensual
 const monthlyMap = {};
 dailyArr.forEach(({ date, pnl }) =>{ const m = date.substring(0,7); monthlyMap[m] = (monthlyMap[m]||0) + pnl; });
 const monthlyArr = Object.entries(monthlyMap).sort(([a],[b]) => a.localeCompare(b)).map(([month, pnl]) =>({ month, pnl }));

 // Max drawdown
 let peak = 0, maxDD = 0, runEq = 0;
 dailyArr.forEach(({ pnl }) =>{ runEq += pnl; if (runEq > peak) peak = runEq; const dd = peak - runEq; if (dd > maxDD) maxDD = dd; });

 // Días positivos / sobre $200
 const daysPos = dailyArr.filter(d => d.pnl > 0).length;
 const daysOver200 = dailyArr.filter(d => d.pnl >= 200).length;

 // Peor día
 const worstDay = dailyArr.length > 0
 ? dailyArr.reduce((w, d) => d.pnl < w.pnl ? d : w, { date:'', pnl: 0 })
 : { date:'', pnl: 0 };

 // Racha negativa y positiva máxima (días)
 let maxLoseStreak = 0, maxWinStreak = 0, curLose = 0, curWin = 0;
 dailyArr.forEach(({ pnl }) =>{
 if (pnl < 0) { curLose++; curWin = 0; if (curLose > maxLoseStreak) maxLoseStreak = curLose; }
 else if (pnl > 0) { curWin++; curLose = 0; if (curWin > maxWinStreak) maxWinStreak = curWin; }
 else { curLose = 0; curWin = 0; }
 });

 // tradesArr: lista cronológica trade-level (solo {date, pnl})
 // Se persiste para que los simuladores iteren trade a trade
 // y apliquen correctamente cap ganancia/día y corte por objetivo
 const tradesArr = trades
 .filter(t =>{ const dow = new Date(t.date + 'T12:00:00').getDay(); return dow !== 0 && dow !== 6; })
 .map(t =>({ date: t.date, pnl: parseFloat(t.pnl.toFixed(2)) }));
 return { totalTrades, wins, losses, wr, pf, totalPnl, grossWin, grossLoss, monthlyArr, dailyArr, tradesArr, maxDD, daysPos, daysOver200, worstDay, maxLoseStreak, maxWinStreak, totalDays: dailyArr.length };
 };

 // Métricas brutas (NT8 sin filtros)
 const rawMetrics = calcMetrics(allTrades);

 // Métricas filtradas (con reglas operativas)
 const filteredTrades = applyOperativeFilters(allTrades, filterRules);
 const filteredMetrics = calcMetrics(filteredTrades);

 setBacktestResults({
 strategyId,
 raw: rawMetrics,
 filtered: filteredMetrics,
 // Para compatibilidad con lo que ya usa el modal de preview
 ...rawMetrics,
 monthlyArr: rawMetrics.monthlyArr,
 dailyArr: rawMetrics.dailyArr,
 });
 message.success(`CSV procesado: ${rawMetrics.totalTrades} trades brutos / ${filteredMetrics.totalTrades} con filtros operativos.`);
 };

 // Calcula el estado de retiro (gate de días calificantes + cap de ciclo) para una cuenta
 const calcFleetMetrics = (acc) =>{
 const diasCalifNecesarios = acc.dias_calif_necesarios ?? 5;
 const minimoDiario = acc.minimo_diario_calificante ?? 150;
 const retiroMax = acc.retiro_max_ciclo ?? 2000;
 const pctMax = acc.pct_max_retiro_ciclo ?? 0.5;
 const ciclosMax = acc.ciclos_max ?? 5;
 const retirosRealizados = acc.retiros_realizados ?? 0;
 const pnlAlUltimoRetiro = acc.pnl_al_ultimo_retiro ?? 0;
 const fechaUltimoRetiro = acc.fecha_ultimo_retiro ? new Date(acc.fecha_ultimo_retiro) : null;
 // Si la cuenta viene de una conversión Eval->Master, no mezclar días de la fase Evaluación
 const fechaConversion = acc.fecha_conversion_master ? new Date(acc.fecha_conversion_master) : null;

 const historial = fleetDailyPnl[acc.id] || [];
 const historialRelevante = fechaConversion ? historial.filter(d => new Date(d.date) >= fechaConversion) : historial;
 const diasDelCiclo = historialRelevante.filter(d => !fechaUltimoRetiro || new Date(d.date) > fechaUltimoRetiro);
 const diasCalifAcumulados = diasDelCiclo.filter(d => parseFloat(d.pnl_amount) >= minimoDiario).length;

 const gananciaCiclo = (acc.pnl || 0) - pnlAlUltimoRetiro;
 const cicloAgotado = retirosRealizados >= ciclosMax;
 const retiroDisponible = !cicloAgotado && diasCalifAcumulados >= diasCalifNecesarios && gananciaCiclo > 0;
 const montoSugerido = retiroDisponible ? Math.min(retiroMax, gananciaCiclo * pctMax) : 0;

 // Alarma de inactividad: hito de partida = fecha de compra (o de conversión a Master) hasta el primer trade,
 // luego se recalcula desde el trade más reciente cargado.
 const diasInactividadMax = acc.dias_inactividad_max ?? 30;
 const fechaUltimaActividad = historialRelevante.length > 0
 ? new Date(Math.max(...historialRelevante.map(d => new Date(d.date).getTime())))
 : (fechaConversion || (acc.creation_date ? new Date(acc.creation_date) : null));
 let diasInactividad = null;
 if (fechaUltimaActividad) {
 diasInactividad = Math.floor((new Date() - fechaUltimaActividad) / (1000 * 60 * 60 * 24));
 }
 const alarmaInactividad = diasInactividad !== null && diasInactividad >= diasInactividadMax;
 const avisoInactividad = diasInactividad !== null && diasInactividad === diasInactividadMax - 1;

 return { diasCalifAcumulados, diasCalifNecesarios, gananciaCiclo, retiroDisponible, montoSugerido, retirosRealizados, ciclosMax, cicloAgotado,
 diasInactividad, diasInactividadMax, alarmaInactividad, avisoInactividad };
 };

 const getProgressPercent = (balanceNew, balanceInitial, goal) =>{
 if (!goal) return 0;
 if (balanceNew === balanceInitial) return 0;
 const percent = ((balanceNew - balanceInitial) / goal) * 100;
 return parseFloat(percent.toFixed(1));
 };

 const getProgressColor = (percent) =>{
 if (percent >= 100) return '#00b96b';
 if (percent >= 80) return '#1677ff';
 if (percent >= 50) return '#faad14';
 return '#ff4d4f';
 };

 const handlePropSubmit = async (values) =>{
 const balance = Number(values.balance) || 0;

 const rawTotal = values.totalDrawdownPercent ? String(values.totalDrawdownPercent).replace('%','') : '0';

 // -- BUG FIX: PnL acumulativo ------------------------------
 // ANTES: pnl: parsedPnl (sobreescribía)
 // AHORA: pnl: (acc.pnl || 0) + parsedPnl (acumula)
 const handleLucidOk = () =>{
 if (!lucidAccountKey) { message.error('Falta seleccionar la cuenta.'); return; }
 if (lucidDailyPnl === null || lucidDailyPnl === undefined || lucidDailyPnl === '') { message.error('Falta el PnL del día.'); return; }
 (async () =>{
 const values = { accountKey: lucidAccountKey, dailyPnl: lucidDailyPnl };
 const parsedPnl = parseFloat(values.dailyPnl);
 const acc = accounts.find(a =>(a.key && a.key === values.accountKey) || (a.id && a.id === values.accountKey));
 if (!acc) { message.error("Cuenta no encontrada"); return; }

 const initial = acc.balance; // balance en DB es siempre el saldo inicial
 // FIX: acumular PnL en lugar de sobreescribir
 const pnlAcumulado = (acc.pnl || 0) + parsedPnl;
 const balanceNew = acc.balance + pnlAcumulado; // balance real = balance base + PnL acumulado
 let newStatus = balanceNew >= initial ? 'Activa' : (balanceNew < initial - 1000 ? 'Peligro' : 'Advertencia');

 let newThreshold;
 const drawdownType = acc.drawdown_type || 'Fijo';
 const maxDrawdown = parseFloat(acc.max_drawdown) || 3000;
 if (drawdownType === 'Fijo') {
 newThreshold = initial - maxDrawdown;
 } else if (drawdownType === 'EOD' || drawdownType === 'Trailing') {
 const calculatedThreshold = balanceNew - maxDrawdown;
 let cappedThreshold = calculatedThreshold;
 if (drawdownType === 'EOD') cappedThreshold = Math.min(initial + 100, calculatedThreshold);
 const previousThreshold = parseFloat(acc.threshold) || (initial - maxDrawdown);
 newThreshold = Math.max(previousThreshold, cappedThreshold);
 }

 const tableName = 'prop_accounts';
 


 // Guardar registro diario en prop_daily_pnl para métricas de estrategia
 if (acc.id) {
 await supabase.from('prop_daily_pnl').insert([{
 account_id: acc.id,
 date: new Date().toISOString().split('T')[0],
 pnl_amount: parsedPnl
 }]);
 }

 const { error } = await supabase.from(tableName).update({
 pnl: pnlAcumulado, // FIX: usa el acumulado
 status: newStatus,
 threshold: newThreshold
 }).eq('id', acc.id);

 if (!error) {
 setAccounts(accounts.map(a =>{
 if (a.id === acc.id)
 return { ...a, pnl: pnlAcumulado, status: newStatus, threshold: newThreshold };
 return a;
 }));
 setIsLucidModalVisible(false); setLucidAccountKey(null); setLucidDailyPnl(null);
 message.success(`Avance registrado. PnL acumulado: $${pnlAcumulado.toFixed(2)}`);
 // Refrescar métricas de estrategia
 fetchStrategyMetrics();
 } else {
 message.error('Error al registrar: ' + error.message);
 }
 })();
 };

 window.parseMTReport = async (htmlString, accountId) =>{
 try {
 if (!currentUser || !currentUser.id) { message.error("Sesión inválida."); setIsAuthenticated(false); return; }
 const parser = new DOMParser();
 const doc = parser.parseFromString(htmlString, "text/html");
 let balance = 0, floatingPnl = 0, equity = 0;
 const tds = Array.from(doc.querySelectorAll('td, th, div, span, b'));

 if (rows.length < 2) { message.error('CSV vacío o formato incorrecto.'); return; }
 const headers = rows[0].map(h => h.toLowerCase().trim());
 const nameIndex = headers.findIndex(h => h === 'display name' || h.includes('display name'));

 if (nameIndex === -1 || pnlIndex === -1) { message.error('No se encontraron columnas "Display name" o "Realized PnL".'); return; }
 let updatedCount = 0;

 if (matchingRow && matchingRow[pnlIndex]) {
 const pnlStr = matchingRow[pnlIndex].replace(/[^\d,-]/g,'').replace(',','.');
 const parsedPnl = parseFloat(pnlStr);
 if (!isNaN(parsedPnl)) {
 const initial = acc.balance;

 const balNew = acc.balance + pnlAcum;
 let newStatus = balNew >= initial ? 'Activa' : (balNew < initial - 1000 ? 'Peligro' : 'Advertencia');
 updatedCount++;
 return { ...acc, pnl: pnlAcum, status: newStatus };
 }
 }
 return acc;
 });
